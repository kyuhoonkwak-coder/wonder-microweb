steps:
  # 1) 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'
      - .

  # 2) 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'

  # 3) Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - wonder-microweb
      - '--image=gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--quiet'

  # 4) Firebase Hosting 배포 (web.app 도메인이 최신 Cloud Run을 바라보도록 갱신)
  - name: 'node:20'
    entrypoint: npx
    args:
      - firebase-tools
      - deploy
      - '--only'
      - hosting
      - '--project'
      - '$PROJECT_ID'
      - '--non-interactive'

images:
  - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
