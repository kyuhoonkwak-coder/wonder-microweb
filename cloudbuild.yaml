steps:
  # 1) 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'
      - .

  # 2) 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'

  # 3) Cloud Run 배포 (Firebase Hosting 미사용 — Cloud Run URL 직접 접속이므로 공개 접근 허용)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - wonder-microweb
      - '--image=gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/github.com/kyuhoonkwak-coder/wonder-microweb:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
